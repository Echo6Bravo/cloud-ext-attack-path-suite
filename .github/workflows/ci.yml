name: CI

# Enterprise-readiness gate: proves the suite runs on the documented version floors
# (Python 3.7+, old curl/jq) with stdlib only — no third-party packages.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  python-matrix:
    name: Python ${{ matrix.python }} (stdlib-only suite)
    # 3.7/3.8 are only provided by actions/setup-python on ubuntu-22.04, not 24.04.
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { python: "3.7", runner: "ubuntu-22.04" }
          - { python: "3.8", runner: "ubuntu-22.04" }
          - { python: "3.9", runner: "ubuntu-latest" }
          - { python: "3.11", runner: "ubuntu-latest" }
          - { python: "3.12", runner: "ubuntu-latest" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Run portable test suite
        run: bash tests/run_tests.sh

  old-curl:
    name: Old curl/jq portability (RHEL8/buster-era)
    runs-on: ubuntu-latest
    # curl 7.64 + jq 1.5 — both below the 7.76 that --fail-with-body needs, so this fails
    # if anyone reintroduces a modern-only curl flag.
    container: debian:buster-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install old toolchain from archive
        run: |
          sed -i 's|deb.debian.org|archive.debian.org|g; s|security.debian.org|archive.debian.org|g; /buster-updates/d' /etc/apt/sources.list
          apt-get -o Acquire::Check-Valid-Until=false -qq update
          apt-get -qq install -y jq curl python3 ca-certificates
          curl --version | head -1
      - name: Run suite (exercises the GraphQL caller on old curl)
        run: bash tests/run_tests.sh

  lint:
    name: Lint (ruff + bandit + shellcheck + actionlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install linters
        run: |
          pip install --quiet ruff bandit
          sudo apt-get -qq update && sudo apt-get -qq install -y shellcheck
          # actionlint via its official installer script
          bash <(curl -sSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
      - name: ruff (python lint)
        run: ruff check .
      - name: bandit (python SAST)
        # asserts (B101) are intentional dev-time invariants; tests/dist/plugins excluded.
        run: bandit -q -r . --skip B101 --exclude ./tests,./dist,./plugins
      - name: shellcheck (bash)
        run: |
          find . -name '*.sh' -not -path './dist/*' -print0 \
            | xargs -0 shellcheck -S warning -e SC1090,SC1091
      - name: actionlint (workflow lint)
        run: ./actionlint -color

  secret-scan:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 pulls the ENTIRE history so a committed-then-deleted secret is caught,
      # not just the current tree. This is the unskippable third layer behind the PreToolUse
      # hook (pre-command) and quality-review (pre-submission).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          VER=8.30.1
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Scan full git history
        # non-zero exit if any leak is found -> fails the build (no --exit-code override).
        run: gitleaks git --no-banner --redact .
